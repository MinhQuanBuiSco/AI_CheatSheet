    { name = "MinhQuanBuiSco", email = "quanbm2710@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.54.0",
    "datasets>=3.1.0",
    "pandas>=2.2.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "scikit-learn>=1.5.0",
    "transformers>=4.36.0",
    "torch>=2.1.0",
