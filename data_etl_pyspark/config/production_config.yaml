# Production Configuration Template
# Copy and modify this for production deployments

dataset:
  name: "bookcorpus"
  split: "train"  # Full dataset
  # config: "subset_name"  # If needed

output:
  dir: "s3://your-bucket/processed_data"  # Or HDFS path
  format: "delta"  # Delta Lake for ACID transactions
  partition_by: ["processing_date"]  # Partition by date
  compression: "snappy"

filters:
  min_word_count: 50
  max_word_count: 10000
  repetition_threshold: 0.3
  language: "en"
  dedup_threshold: 0.9
  quality_model: "distilbert-base-uncased-finetuned-sst-2-english"
  quality_threshold: 0.5

processing:
  batch_size: 2048  # Large batches for throughput
  num_partitions: "auto"  # Let Spark optimize
  cache_intermediate: true  # Enable caching
  checkpoint_interval: 10

spark:
  # Dynamic resource allocation for auto-scaling
  dynamic_allocation:
    enabled: true
    min_executors: 5
    max_executors: 100
    initial_executors: 20
  
  # Production memory settings
  memory:
    executor: "16g"  # Large executor memory
    driver: "8g"     # Large driver memory
    executor_memory_fraction: 0.8
    executor_memory_storage_fraction: 0.3
  
  # Advanced performance tuning
  sql:
    adaptive:
      enabled: true
      coalesce_partitions: true
      skew_join: true
    
  # Kryo serialization for performance
  serializer: "org.apache.spark.serializer.KryoSerializer"
  kryo_registration_required: false
  
  # Network optimization
  network_timeout: "300s"
  executor_heartbeat_interval: "20s"
  
  # Shuffle optimization
  shuffle:
    service: true
    compress: true
    spill_compress: true

monitoring:
  metrics_enabled: true
  checkpoint_dir: "s3://your-bucket/checkpoints"  # Or HDFS
  metrics_dir: "s3://your-bucket/metrics"
  
logging:
  level: INFO
  structured: true