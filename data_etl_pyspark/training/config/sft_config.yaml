# Production SFT Training Configuration
# Optimized for big tech scale deployment

# Model Configuration
model:
  name: "microsoft/DialoGPT-small"  # Change to your target model
  revision: "main"
  use_auth_token: false
  trust_remote_code: false

# Dataset Configuration  
dataset:
  path: "../processed_data/processed_dataset.parquet"
  text_column: "text"
  max_seq_length: 512
  train_test_split: 0.9  # 90% train, 10% eval
  streaming: false

# Training Hyperparameters
training:
  # Basic settings
  output_dir: "./outputs/sft-model"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  
  # Learning rate and optimization
  learning_rate: 5e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  optim: "adamw_torch"  # Use "adamw_bnb_8bit" for memory efficiency
  
  # Memory optimization
  fp16: false  # Disabled for Mac M4 (MPS doesn't support FP16)
  bf16: false  # Not supported on Mac
  gradient_checkpointing: true
  dataloader_num_workers: 4
  dataloader_pin_memory: true

# LoRA (Parameter-Efficient Fine-tuning)
lora:
  enabled: true
  r: 16  # Rank - higher = more parameters but better performance
  alpha: 32  # Scaling factor - typically 2x rank
  dropout: 0.1
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]  # Attention modules
  bias: "none"

# Evaluation and Monitoring
evaluation:
  strategy: "steps"  # "steps" or "epoch"
  eval_steps: 100
  save_strategy: "steps"
  save_steps: 100
  logging_steps: 10
  
  # Model selection
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  save_total_limit: 3
  
  # Early stopping
  early_stopping_patience: 5
  early_stopping_threshold: 0.001

# Monitoring and Logging
# monitoring:
#   use_wandb: true
#   wandb_project: "llm-sft-training"
#   wandb_run_name: null  # Auto-generated if null
#   wandb_tags: ["sft", "production"]
#   report_to: ["wandb", "tensorboard"]
  
#   # Advanced monitoring
#   log_predictions: false  # Log sample predictions during eval
#   save_training_dynamics: true  # Save loss curves and metrics

# Distributed Training
distributed:
  # Multi-GPU settings
  local_rank: -1
  world_size: 1
  
  # DeepSpeed configuration (optional)
  deepspeed_config: null  # Path to deepspeed config file
  
  # FSDP (Fully Sharded Data Parallel)
  fsdp: false

# Reproducibility
reproducibility:
  seed: 42
  data_seed: 42
  deterministic: true

# Advanced Features
advanced:
  # Checkpointing
  resume_from_checkpoint: null  # Path to checkpoint directory
  
  # Hub integration
  push_to_hub: false
  hub_model_id: null  # Your model ID on Hub
  hub_strategy: "every_save"
  
  # Memory optimization
  use_cpu_for_model: false
  low_cpu_mem_usage: true
  
  # Data optimization
  packing: true  # Pack multiple sequences per sample
  remove_unused_columns: false

# Hardware-specific optimizations
hardware:
  # GPU optimizations
  cuda_launch_blocking: false
  torch_compile: false  # PyTorch 2.0 compilation (experimental)
  
  # Memory settings
  max_memory_usage: 0.9  # 90% of available GPU memory
  gradient_checkpointing_kwargs:
    use_reentrant: false

# Model-specific settings (adjust based on your model)
model_specific:
  # For smaller models (< 1B parameters)
  small_model:
    batch_size: 8
    gradient_accumulation: 2
    learning_rate: 1e-4
    lora_r: 8
    
  # For medium models (1B - 7B parameters)  
  medium_model:
    batch_size: 4
    gradient_accumulation: 4
    learning_rate: 5e-5
    lora_r: 16
    
  # For large models (> 7B parameters)
  large_model:
    batch_size: 1
    gradient_accumulation: 16
    learning_rate: 2e-5
    lora_r: 32
    fp16: false
    bf16: true
    gradient_checkpointing: true