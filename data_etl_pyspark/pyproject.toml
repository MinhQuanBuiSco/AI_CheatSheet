[project]
name = "data-etl-pyspark"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MinhQuanBuiSco", email = "quanbm2710@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets==3.6.0",
    "langdetect>=1.0.9",
    "pandas>=2.3.2",
    "pyspark>=4.0.1",
    "pytest>=8.4.2",
    "pyyaml>=6.0.2",
    "torch>=2.8.0",
    "transformers>=4.56.1",
    # Performance and monitoring
    "psutil>=6.1.0", # System resource monitoring
    "numpy>=1.24.0", # Numerical operations
    # Optional: Delta Lake support (uncomment if needed)
    # "delta-spark>=3.0.0",
    # Optional: Advanced compression
    # "snappy>=0.7.0",
    "peft>=0.17.1",
    "trl>=0.23.0",
    "wandb>=0.21.4",
    "evaluate>=0.4.5",
    "nltk>=3.9.1",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.5.1",
    "bert-score>=0.3.13",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
]

monitoring = [
    "prometheus-client>=0.21.0",
    "grafana-client>=3.5.0",
]

delta = [
    "delta-spark>=3.0.0",
]

[project.scripts]
data-etl-pyspark = "data_etl_pyspark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
