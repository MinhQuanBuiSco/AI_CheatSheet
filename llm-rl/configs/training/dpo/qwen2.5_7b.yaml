# DPO Training with Qwen2.5-7B-Instruct (with QLoRA)

method: "dpo"

model:
  model_name_or_path: "Qwen/Qwen2.5-7B-Instruct"
  model_size: "medium"
  use_peft: true
  load_in_4bit: true  # QLoRA for memory efficiency
  load_in_8bit: false
  torch_dtype: "bfloat16"
  trust_remote_code: false

peft:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: null  # Auto-detect for Qwen
  bias: "none"
  task_type: "CAUSAL_LM"

dataset:
  dataset_name: "ultrafeedback-binarized"
  dataset_subset: null
  train_split: "train_prefs"
  eval_split: "test_prefs"
  max_train_samples: 10000
  max_eval_samples: 500
  max_length: 512
  max_prompt_length: 256
  preprocessing_num_workers: 4

training:
  output_dir: "./outputs/dpo_qwen2.5_7b"
  num_train_epochs: 1
  per_device_train_batch_size: 2  # Smaller batch for 7B
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8  # More accumulation
  learning_rate: 2.0e-5  # Lower LR for larger model
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  logging_steps: 10
  eval_steps: 100
  save_steps: 500
  save_total_limit: 2
  fp16: false
  bf16: true
  gradient_checkpointing: true
  seed: 42
  optim: "adamw_torch"
  lr_scheduler_type: "cosine"
  report_to: ["tensorboard"]
  ddp_find_unused_parameters: null
  deepspeed: null

logging:
  wandb_project: null
  wandb_entity: null
  wandb_run_name: null
  tensorboard_dir: null
  log_level: "info"

# DPO-specific parameters
beta: 0.1
label_smoothing: 0.0
loss_type: "sigmoid"
label_pad_token_id: -100
padding_value: 0
truncation_mode: "keep_end"
max_prompt_length: 256
max_length: 512
generate_during_eval: false  # Disable for faster training
precompute_ref_log_probs: false
reference_free: false
force_use_ref_model: false
ref_model_name_or_path: null
