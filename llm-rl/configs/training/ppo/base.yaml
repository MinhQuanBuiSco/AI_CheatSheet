# PPO Training Configuration - Base

method: "ppo"

model:
  model_name_or_path: "gpt2"
  model_size: "small"
  use_peft: true
  load_in_4bit: false
  load_in_8bit: false
  torch_dtype: "bfloat16"
  trust_remote_code: false

peft:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: null
  bias: "none"
  task_type: "CAUSAL_LM"

dataset:
  dataset_name: "anthropic-hh-rlhf"
  dataset_subset: null
  train_split: "train"
  eval_split: "test"
  max_train_samples: 5000
  max_eval_samples: 500
  max_length: 512
  max_prompt_length: 256
  preprocessing_num_workers: 4

training:
  output_dir: "./outputs/ppo_gpt2"
  num_train_epochs: 1
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  logging_steps: 10
  eval_steps: null
  save_steps: 500
  save_total_limit: 3
  fp16: false
  bf16: true
  gradient_checkpointing: true
  seed: 42
  optim: "adamw_torch"
  lr_scheduler_type: "cosine"
  report_to: ["tensorboard"]
  ddp_find_unused_parameters: null
  deepspeed: null

logging:
  wandb_project: null
  wandb_entity: null
  wandb_run_name: null
  tensorboard_dir: null
  log_level: "info"

# PPO-specific parameters
reward_model_name_or_path: "./outputs/reward_model"  # Path to trained reward model
reward_model_device: null
init_kl_coef: 0.2
target_kl: 6.0
adap_kl_ctrl: true
gamma: 1.0
lam: 0.95
cliprange: 0.2
cliprange_value: 0.2
vf_coef: 0.1
batch_size: 128
forward_batch_size: null
ppo_epochs: 4
max_new_tokens: 128
temperature: 1.0
top_k: 0
top_p: 1.0
do_sample: true
remove_unused_columns: false
optimize_device_cache: false
