[project]
name = "llm-rl"
version = "0.1.0"
description = "Production-ready demonstration platform for LLM fine-tuning with various RL approaches (DPO, PPO, Online DPO, GRPO)"
readme = "README.md"
authors = [
    { name = "Quan", email = "minhquan.bui@amifiable.co.jp" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.46.0",
    "trl>=0.12.0",
    "peft>=0.13.0",
    "accelerate>=1.2.0",
    "datasets>=2.15.0",
    "deepspeed>=0.12.0",
    "bitsandbytes>=0.41.0",
    "typer>=0.9.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "wandb>=0.16.0",
    "tensorboard>=2.15.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
]

[project.scripts]
llm-rl = "llm_rl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
