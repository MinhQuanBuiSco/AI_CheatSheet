apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-processing-api
  namespace: data-processing
  labels:
    app: data-processing
    component: api
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-processing
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: data-processing
        component: api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: data-processing-sa
      containers:
      - name: api
        image: data-processing:v1.0.0
        imagePullPolicy: Never
        command: ["/opt/venv/bin/uvicorn"]
        args: ["data_processing.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "/app/src"]
        workingDir: /app
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: data-processing-config
              key: log_level
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8000"
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: data-processing-secrets
              key: postgres_host
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: data-processing-secrets
              key: postgres_password
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: data-processing-secrets
              key: redis_url
        # S3/MinIO Configuration (for object storage)
        - name: AWS_ACCESS_KEY_ID
          value: "minioadmin"  # Change for production S3
        - name: AWS_SECRET_ACCESS_KEY
          value: "minioadmin"  # Change for production S3
        - name: AWS_ENDPOINT_URL
          value: "http://minio:9000"  # MinIO endpoint (remove for production S3)
        - name: AWS_REGION
          value: "us-east-1"
        # Pod IP for Spark driver networking (Kubernetes Downward API)
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        volumeMounts:
        - name: data
          mountPath: /app/data
          readOnly: true
        - name: output
          mountPath: /app/output
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data-processing-data-pvc
      - name: output
        persistentVolumeClaim:
          claimName: data-processing-output-pvc
      - name: logs
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - data-processing
              topologyKey: kubernetes.io/hostname
