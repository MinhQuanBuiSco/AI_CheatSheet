# Spark Log4j Configuration for CLIO Demo
# Optimized for debugging and production monitoring

# Set root logger level and appenders
log4j.rootCategory=INFO, console, file

# Console appender - for docker logs
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%p] [%c{1}] %m%n

# File appender - for persistent logs
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=/opt/spark/logs/spark.log
log4j.appender.file.MaxFileSize=100MB
log4j.appender.file.MaxBackupIndex=10
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%p] [%t] [%c{1}] %m%n

# Spark-specific loggers
log4j.logger.org.apache.spark=INFO
log4j.logger.org.apache.spark.deploy=INFO
log4j.logger.org.apache.spark.executor=INFO
log4j.logger.org.apache.spark.scheduler=INFO
log4j.logger.org.apache.spark.storage=INFO

# Reduce verbosity for some packages
log4j.logger.org.apache.hadoop=WARN
log4j.logger.org.apache.parquet=WARN
log4j.logger.org.eclipse.jetty=WARN
log4j.logger.org.sparkproject.jetty=WARN

# Worker and Master logs
log4j.logger.org.apache.spark.deploy.master.Master=INFO
log4j.logger.org.apache.spark.deploy.worker.Worker=INFO

# Application logs (our Python code)
log4j.logger.org.apache.spark.api.python.PythonGatewayServer=INFO
