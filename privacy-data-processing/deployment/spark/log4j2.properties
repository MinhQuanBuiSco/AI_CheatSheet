# Spark Log4j2 Configuration for CLIO Demo (Spark 3.5+)
# This is the correct format for Spark 3.5.0 which uses Log4j2

# Set root logger
rootLogger.level = info
rootLogger.appenderRef.stdout.ref = console
rootLogger.appenderRef.file.ref = file

# Console appender (for docker logs)
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} [%p] [%t] [%c{1}] %m%n

# File appender (persistent logs)
appender.file.type = RollingFile
appender.file.name = file
appender.file.fileName = /opt/spark/logs/spark.log
appender.file.filePattern = /opt/spark/logs/spark-%d{yyyy-MM-dd}-%i.log.gz
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} [%p] [%t] [%c{1}] [Worker: %X{sparkWorker}] %m%n
appender.file.policies.type = Policies
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 100MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 10

# Spark loggers
logger.spark.name = org.apache.spark
logger.spark.level = info

logger.executor.name = org.apache.spark.executor
logger.executor.level = info

logger.scheduler.name = org.apache.spark.scheduler
logger.scheduler.level = info

logger.storage.name = org.apache.spark.storage
logger.storage.level = info

# Worker and Master logs
logger.worker.name = org.apache.spark.deploy.worker
logger.worker.level = info

logger.master.name = org.apache.spark.deploy.master
logger.master.level = info

# Application logs (PySpark)
logger.python.name = org.apache.spark.api.python
logger.python.level = info

# Reduce verbosity
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = warn

logger.parquet.name = org.apache.parquet
logger.parquet.level = warn

logger.jetty.name = org.eclipse.jetty
logger.jetty.level = warn

logger.sparkjetty.name = org.sparkproject.jetty
logger.sparkjetty.level = warn
