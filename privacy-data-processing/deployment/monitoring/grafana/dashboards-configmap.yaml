apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: data-processing
  labels:
    app: grafana
    component: monitoring
data:
  overview.json: |
    {
      "title": "Data Processing - Overview",
      "uid": "data-processing-overview",
      "tags": ["data-processing", "overview"],
      "timezone": "browser",
      "schemaVersion": 16,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
          {
            "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0},
            "id": 1,
            "title": "System Overview",
            "type": "row"
          },
          {
            "datasource": "Prometheus",
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 1},
            "id": 2,
            "targets": [{
              "expr": "sum(rate(records_processed_total{status=\"success\"}[5m]))",
              "refId": "A"
            }],
            "title": "Processing Rate (records/sec)",
            "type": "stat",
            "options": {
              "graphMode": "area",
              "colorMode": "value",
              "textMode": "value_and_name"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "reqps",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "red"},
                    {"value": 1000, "color": "yellow"},
                    {"value": 10000, "color": "green"}
                  ]
                }
              }
            }
          },
          {
            "datasource": "Prometheus",
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 1},
            "id": 3,
            "targets": [{
              "expr": "sum(records_processed_total{status=\"success\"})",
              "refId": "A"
            }],
            "title": "Total Records Processed",
            "type": "stat",
            "options": {
              "graphMode": "area",
              "colorMode": "value"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0
              }
            }
          },
          {
            "datasource": "Prometheus",
            "gridPos": {"h": 4, "w": 6, "x": 12, "y": 1},
            "id": 4,
            "targets": [{
              "expr": "sum(rate(records_processed_total{status=\"failed\"}[5m])) / sum(rate(records_processed_total[5m])) * 100",
              "refId": "A"
            }],
            "title": "Error Rate (%)",
            "type": "stat",
            "options": {
              "graphMode": "area",
              "colorMode": "value"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "green"},
                    {"value": 1, "color": "yellow"},
                    {"value": 5, "color": "red"}
                  ]
                }
              }
            }
          },
          {
            "datasource": "Prometheus",
            "gridPos": {"h": 4, "w": 6, "x": 18, "y": 1},
            "id": 5,
            "targets": [{
              "expr": "sum(pii_entities_detected_total)",
              "refId": "A"
            }],
            "title": "PII Entities Detected",
            "type": "stat",
            "options": {
              "graphMode": "area",
              "colorMode": "value"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0,
                "color": {"mode": "fixed", "fixedColor": "blue"}
              }
            }
          },
          {
            "gridPos": {"h": 1, "w": 24, "x": 0, "y": 5},
            "id": 6,
            "title": "Processing Performance",
            "type": "row"
          },
          {
            "datasource": "Prometheus",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
            "id": 7,
            "targets": [{
              "expr": "sum(rate(records_processed_total{status=\"success\"}[1m])) by (stage)",
              "legendFormat": "{{stage}}",
              "refId": "A"
            }],
            "title": "Processing Throughput by Stage",
            "type": "graph",
            "yaxes": [
              {"format": "reqps", "label": "records/sec"},
              {"format": "short"}
            ],
            "legend": {"show": true, "alignAsTable": true, "avg": true, "current": true, "max": true}
          },
          {
            "datasource": "Prometheus",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6},
            "id": 8,
            "targets": [{
              "expr": "histogram_quantile(0.95, sum(rate(processing_duration_seconds_bucket[5m])) by (le, stage))",
              "legendFormat": "p95 - {{stage}}",
              "refId": "A"
            }, {
              "expr": "histogram_quantile(0.50, sum(rate(processing_duration_seconds_bucket[5m])) by (le, stage))",
              "legendFormat": "p50 - {{stage}}",
              "refId": "B"
            }],
            "title": "Processing Latency (Percentiles)",
            "type": "graph",
            "yaxes": [
              {"format": "s", "label": "duration"},
              {"format": "short"}
            ],
            "legend": {"show": true, "alignAsTable": true, "current": true}
          },
          {
            "gridPos": {"h": 1, "w": 24, "x": 0, "y": 14},
            "id": 9,
            "title": "Privacy & Data Quality",
            "type": "row"
          },
          {
            "datasource": "Prometheus",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 15},
            "id": 10,
            "targets": [{
              "expr": "sum(rate(pii_entities_detected_total[5m])) by (entity_type)",
              "legendFormat": "{{entity_type}}",
              "refId": "A"
            }],
            "title": "PII Detection Rate by Type",
            "type": "graph",
            "yaxes": [
              {"format": "reqps", "label": "detections/sec"},
              {"format": "short"}
            ],
            "legend": {"show": true, "alignAsTable": true, "values": true, "current": true}
          },
          {
            "datasource": "Prometheus",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 15},
            "id": 11,
            "targets": [{
              "expr": "data_quality_score",
              "legendFormat": "{{dataset}}",
              "refId": "A"
            }],
            "title": "Data Quality Score",
            "type": "graph",
            "yaxes": [
              {"format": "percentunit", "label": "quality score", "min": 0, "max": 1},
              {"format": "short"}
            ],
            "legend": {"show": true}
          },
          {
            "gridPos": {"h": 1, "w": 24, "x": 0, "y": 23},
            "id": 12,
            "title": "Resource Utilization",
            "type": "row"
          },
          {
            "datasource": "Prometheus",
            "gridPos": {"h": 6, "w": 8, "x": 0, "y": 24},
            "id": 13,
            "targets": [{
              "expr": "cpu_usage_percent",
              "refId": "A"
            }],
            "title": "CPU Usage",
            "type": "graph",
            "yaxes": [
              {"format": "percent", "label": "CPU %", "min": 0, "max": 100},
              {"format": "short"}
            ]
          },
          {
            "datasource": "Prometheus",
            "gridPos": {"h": 6, "w": 8, "x": 8, "y": 24},
            "id": 14,
            "targets": [{
              "expr": "memory_usage_bytes{type=\"rss\"} / 1024 / 1024 / 1024",
              "legendFormat": "RSS",
              "refId": "A"
            }, {
              "expr": "memory_usage_bytes{type=\"vms\"} / 1024 / 1024 / 1024",
              "legendFormat": "VMS",
              "refId": "B"
            }],
            "title": "Memory Usage",
            "type": "graph",
            "yaxes": [
              {"format": "decgbytes", "label": "memory"},
              {"format": "short"}
            ],
            "legend": {"show": true}
          },
          {
            "datasource": "Prometheus",
            "gridPos": {"h": 6, "w": 8, "x": 16, "y": 24},
            "id": 15,
            "targets": [{
              "expr": "sum(rate(storage_operations_total{status=\"success\"}[5m])) by (operation)",
              "legendFormat": "{{operation}}",
              "refId": "A"
            }],
            "title": "Storage Operations",
            "type": "graph",
            "yaxes": [
              {"format": "ops", "label": "operations/sec"},
              {"format": "short"}
            ],
            "legend": {"show": true, "alignAsTable": true}
          }
        ]
    }
  privacy.json: |
    {
      "title": "Privacy & Audit Monitoring",
      "uid": "privacy-audit-monitoring",
      "tags": ["privacy", "audit", "security"],
      "timezone": "browser",
      "schemaVersion": 16,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
          {
            "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0},
            "id": 1,
            "title": "PII Detection & Anonymization",
            "type": "row"
          },
          {
            "datasource": "Prometheus",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 1},
            "id": 2,
            "targets": [{
              "expr": "sum(increase(pii_entities_detected_total[1h])) by (entity_type)",
              "legendFormat": "{{entity_type}}",
              "refId": "A"
            }],
            "title": "PII Entities Detected (Last Hour)",
            "type": "piechart",
            "options": {
              "legend": {"displayMode": "table", "placement": "right", "values": ["value", "percent"]},
              "pieType": "pie"
            }
          },
          {
            "datasource": "Prometheus",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 1},
            "id": 3,
            "targets": [{
              "expr": "sum(rate(anonymization_operations_total{status=\"success\"}[5m])) by (method)",
              "legendFormat": "{{method}}",
              "refId": "A"
            }],
            "title": "Anonymization Operations by Method",
            "type": "graph",
            "yaxes": [
              {"format": "ops", "label": "operations/sec"},
              {"format": "short"}
            ],
            "legend": {"show": true, "alignAsTable": true, "current": true, "total": true}
          },
          {
            "gridPos": {"h": 1, "w": 24, "x": 0, "y": 9},
            "id": 4,
            "title": "Audit & Compliance",
            "type": "row"
          },
          {
            "datasource": "Prometheus",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 10},
            "id": 5,
            "targets": [{
              "expr": "sum(rate(audit_log_writes_total{status=\"success\"}[5m])) by (operation)",
              "legendFormat": "{{operation}}",
              "refId": "A"
            }],
            "title": "Audit Log Writes",
            "type": "graph",
            "yaxes": [
              {"format": "wps", "label": "writes/sec"},
              {"format": "short"}
            ]
          },
          {
            "datasource": "Prometheus",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 10},
            "id": 6,
            "targets": [{
              "expr": "sum(privacy_policy_violations_total) by (violation_type)",
              "legendFormat": "{{violation_type}}",
              "refId": "A"
            }],
            "title": "Privacy Policy Violations",
            "type": "stat",
            "options": {
              "graphMode": "area",
              "colorMode": "value"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "green"},
                    {"value": 1, "color": "red"}
                  ]
                }
              }
            }
          },
          {
            "gridPos": {"h": 1, "w": 24, "x": 0, "y": 18},
            "id": 7,
            "title": "Privacy Operations Health",
            "type": "row"
          },
          {
            "datasource": "Prometheus",
            "gridPos": {"h": 6, "w": 8, "x": 0, "y": 19},
            "id": 8,
            "targets": [{
              "expr": "sum(rate(anonymization_operations_total{status=\"failed\"}[5m]))",
              "refId": "A"
            }],
            "title": "Anonymization Failure Rate",
            "type": "stat",
            "options": {
              "graphMode": "area",
              "colorMode": "value"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "ops",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "green"},
                    {"value": 0.1, "color": "yellow"},
                    {"value": 1, "color": "red"}
                  ]
                }
              }
            }
          },
          {
            "datasource": "Prometheus",
            "gridPos": {"h": 6, "w": 8, "x": 8, "y": 19},
            "id": 9,
            "targets": [{
              "expr": "sum(rate(encryption_operations_total{status=\"success\"}[5m]))",
              "refId": "A"
            }],
            "title": "Encryption Operations",
            "type": "stat",
            "options": {
              "graphMode": "area",
              "colorMode": "value"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "ops",
                "color": {"mode": "fixed", "fixedColor": "blue"}
              }
            }
          },
          {
            "datasource": "Prometheus",
            "gridPos": {"h": 6, "w": 8, "x": 16, "y": 19},
            "id": 10,
            "targets": [{
              "expr": "sum(rate(audit_log_writes_total{status=\"failed\"}[5m]))",
              "refId": "A"
            }],
            "title": "Audit Log Write Failures",
            "type": "stat",
            "options": {
              "graphMode": "area",
              "colorMode": "value"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "failps",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "green"},
                    {"value": 0.01, "color": "red"}
                  ]
                }
              }
            }
          }
        ]
    }
