# Docker Compose for local development and testing
version: '3.8'

services:
  # Main data processing service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: data-processing:latest
    container_name: data-processing-app
    volumes:
      - ./demo_data:/app/data:ro
      - ./demo_output:/app/output
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    networks:
      - data-processing-network
    command: python -m data_processing info

  # FastAPI REST API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: data-processing:latest
    # Run as root in dev to avoid permission issues (DO NOT use in production!)
    user: root
    # Removed container_name to allow scaling
    expose:
      - "8000"  # Expose to nginx, not to host
    deploy:
      replicas: 1  # Increase for horizontal scaling: docker-compose up -d --scale api=3
    volumes:
      - ./demo_data:/app/data:ro
      - ./demo_output:/app/output
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - JAVA_HOME=/usr/lib/jvm/java-21-openjdk-arm64
      - PATH=/usr/lib/jvm/java-21-openjdk-arm64/bin:/opt/venv/bin:/usr/local/bin:/usr/bin:/bin
    networks:
      - data-processing-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: uvicorn data_processing.api.main:app --host 0.0.0.0 --port 8000

  # PostgreSQL for metadata storage
  postgres:
    image: postgres:16-alpine
    container_name: data-processing-postgres
    environment:
      - POSTGRES_USER=dataprocessing
      - POSTGRES_PASSWORD=dataprocessing
      - POSTGRES_DB=metadata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data-processing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataprocessing"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: data-processing-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - data-processing-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: data-processing-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - data-processing-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: data-processing-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deployment/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deployment/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    networks:
      - data-processing-network
    depends_on:
      - prometheus

  # Spark master (for distributed processing)
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
      target: spark-worker
    image: data-processing-spark:latest
    container_name: spark-master
    ports:
      - "7077:7077"  # Spark master port
      - "8080:8080"  # Spark UI
    volumes:
      - ./deployment/spark/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
      - ./logs/spark-master:/opt/spark/logs
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_LOG_DIR=/opt/spark/logs
      - SPARK_CONF_DIR=/opt/spark/conf
      - SPARK_DAEMON_JAVA_OPTS=-Dlog4j.configuration=file:/opt/spark/conf/log4j2.properties
    networks:
      - data-processing-network
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  # Spark worker
  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: spark-worker
    image: data-processing-spark:latest
    depends_on:
      - spark-master
    volumes:
      - ./demo_data:/app/data:ro
      - ./demo_output:/app/output
      - ./deployment/spark/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
      - ./logs/spark-workers:/opt/spark/logs
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=4g
      - SPARK_LOG_DIR=/opt/spark/logs
      - SPARK_CONF_DIR=/opt/spark/conf
      - SPARK_DAEMON_JAVA_OPTS=-Dlog4j.configuration=file:/opt/spark/conf/log4j2.properties
    networks:
      - data-processing-network
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    deploy:
      replicas: 2

  # Nginx load balancer for API
  nginx:
    image: nginx:alpine
    container_name: data-processing-nginx
    ports:
      - "8000:80"  # Map host 8000 to nginx 80
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - data-processing-network
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-status"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  data-processing-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
