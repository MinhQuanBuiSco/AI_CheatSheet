upstream api_backend {
    # Docker Compose service discovery - all API replicas
    # When scaling with --scale api=N, nginx will load balance across all instances
    server api:8000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name localhost;

    # Increase timeouts for long-running processing jobs
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Root endpoint
    location / {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check endpoint (bypass load balancing for monitoring)
    location /health {
        proxy_pass http://api_backend/health;
        proxy_set_header Host $host;
        access_log off;  # Don't log health checks
    }

    # Metrics endpoint
    location /metrics {
        proxy_pass http://api_backend/metrics;
        proxy_set_header Host $host;
    }

    # API documentation
    location /docs {
        proxy_pass http://api_backend/docs;
        proxy_set_header Host $host;
    }

    # OpenAPI schema
    location /openapi.json {
        proxy_pass http://api_backend/openapi.json;
        proxy_set_header Host $host;
    }

    # Enable status page for monitoring (optional)
    location /nginx-status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;  # Docker networks
        deny all;
    }
}
