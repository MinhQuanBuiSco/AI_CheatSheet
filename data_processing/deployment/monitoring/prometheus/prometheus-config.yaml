apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: data-processing
  labels:
    app: prometheus
    component: monitoring
data:
  prometheus.yml: |
    # Anthropic-level Prometheus Configuration
    # Privacy-first, research-focused monitoring

    global:
      scrape_interval: 15s      # Scrape targets every 15 seconds
      evaluation_interval: 15s   # Evaluate rules every 15 seconds
      external_labels:
        cluster: 'data-processing'
        environment: 'development'

    # Alert manager configuration (optional)
    # alerting:
    #   alertmanagers:
    #   - static_configs:
    #     - targets:
    #       - alertmanager:9093

    # Load alert rules
    rule_files:
      - '/etc/prometheus/alert-rules.yml'

    # Scrape configurations
    scrape_configs:

      # ============================================================
      # Data Processing API - Main application metrics
      # ============================================================
      - job_name: 'data-processing-api'
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
            - data-processing

        # Only scrape pods with component=api label
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_component]
          regex: api
          action: keep

        # Use pod IP for scraping
        - source_labels: [__meta_kubernetes_pod_ip]
          target_label: __address__
          replacement: ${1}:8000

        # Add pod metadata as labels
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace

        metrics_path: '/metrics'
        scrape_interval: 10s  # More frequent for API metrics
        scrape_timeout: 5s

      # ============================================================
      # Spark Master - Cluster coordination metrics
      # ============================================================
      - job_name: 'spark-master'
        static_configs:
        - targets: ['spark-master:8080']

        metrics_path: '/metrics/prometheus'
        scrape_interval: 15s

      # ============================================================
      # Spark Workers - Executor metrics
      # ============================================================
      - job_name: 'spark-workers'
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
            - data-processing

        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_component]
          regex: spark-worker
          action: keep
        - source_labels: [__meta_kubernetes_pod_ip]
          target_label: __address__
          replacement: ${1}:8081
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod

        metrics_path: '/metrics/prometheus'
        scrape_interval: 15s

      # ============================================================
      # MinIO - S3-compatible storage metrics
      # ============================================================
      - job_name: 'minio'
        static_configs:
        - targets: ['minio:9000']

        metrics_path: '/minio/v2/metrics/cluster'
        scrape_interval: 30s  # Less frequent for storage

      # ============================================================
      # Kubernetes State Metrics (optional, if deployed)
      # ============================================================
      # - job_name: 'kube-state-metrics'
      #   static_configs:
      #   - targets: ['kube-state-metrics:8080']

      # ============================================================
      # Node Exporter (optional, for host metrics)
      # ============================================================
      # - job_name: 'node-exporter'
      #   kubernetes_sd_configs:
      #   - role: node
      #   relabel_configs:
      #   - source_labels: [__address__]
      #     regex: '(.*):10250'
      #     replacement: '${1}:9100'
      #     target_label: __address__

      # ============================================================
      # Prometheus Self-Monitoring
      # ============================================================
      - job_name: 'prometheus'
        static_configs:
        - targets: ['localhost:9090']
