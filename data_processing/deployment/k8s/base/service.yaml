apiVersion: v1
kind: Service
metadata:
  name: data-processing-api
  namespace: data-processing
  labels:
    app: data-processing
    component: api
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: data-processing
    component: api
---
apiVersion: v1
kind: Service
metadata:
  name: data-processing-api-headless
  namespace: data-processing
  labels:
    app: data-processing
    component: api
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 8000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: data-processing
    component: api
