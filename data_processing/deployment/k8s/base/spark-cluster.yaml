---
# Spark Master Service
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  namespace: data-processing
spec:
  type: ClusterIP
  ports:
  - port: 7077
    targetPort: 7077
    name: spark
  - port: 8080
    targetPort: 8080
    name: webui
  selector:
    component: spark-master

---
# Spark Master StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spark-master
  namespace: data-processing
spec:
  serviceName: spark-master
  replicas: 1
  selector:
    matchLabels:
      component: spark-master
  template:
    metadata:
      labels:
        component: spark-master
    spec:
      containers:
      - name: spark-master
        image: apache/spark:3.5.0
        command: ["/bin/bash", "-c"]
        args:
        - |
          /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master \
            --host 0.0.0.0 \
            --port 7077 \
            --webui-port 8080
        ports:
        - containerPort: 7077
          name: spark
        - containerPort: 8080
          name: webui
        env:
        - name: SPARK_MASTER_HOST
          value: "0.0.0.0"
        - name: SPARK_MASTER_PORT
          value: "7077"
        - name: SPARK_MASTER_WEBUI_PORT
          value: "8080"
        resources:
          requests:
            memory: "512Mi"
            cpu: "0.5"
          limits:
            memory: "1Gi"
            cpu: "1"

---
# Spark Worker Service (Headless)
apiVersion: v1
kind: Service
metadata:
  name: spark-worker
  namespace: data-processing
spec:
  clusterIP: None
  selector:
    component: spark-worker

---
# Spark Worker StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spark-worker
  namespace: data-processing
spec:
  serviceName: spark-worker
  replicas: 1
  selector:
    matchLabels:
      component: spark-worker
  template:
    metadata:
      labels:
        component: spark-worker
    spec:
      containers:
      - name: spark-worker
        image: apache/spark:3.5.0
        command: ["/bin/bash", "-c"]
        args:
        - |
          # Download Hadoop AWS JARs for S3 support
          mkdir -p /opt/spark/jars-extra
          curl -L -o /opt/spark/jars-extra/hadoop-aws-3.3.4.jar \
            https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.3.4/hadoop-aws-3.3.4.jar
          curl -L -o /opt/spark/jars-extra/aws-java-sdk-bundle-1.12.262.jar \
            https://repo1.maven.org/maven2/com/amazonaws/aws-java-sdk-bundle/1.12.262/aws-java-sdk-bundle-1.12.262.jar

          # Add JARs to classpath
          export SPARK_DIST_CLASSPATH="/opt/spark/jars-extra/*:$SPARK_DIST_CLASSPATH"

          # Start worker
          /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker \
            spark://spark-master:7077 \
            --memory 2g \
            --cores 2
        env:
        - name: SPARK_WORKER_MEMORY
          value: "2g"
        - name: SPARK_WORKER_CORES
          value: "2"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
