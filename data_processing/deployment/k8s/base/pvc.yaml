apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-processing-data-pvc
  namespace: data-processing
spec:
  accessModes:
  - ReadOnlyMany
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-processing-output-pvc
  namespace: data-processing
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 20Gi
