apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-processing-data-pvc
  namespace: data-processing
spec:
  accessModes:
  - ReadOnlyMany
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-processing-output-pvc
  namespace: data-processing
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 500Gi
